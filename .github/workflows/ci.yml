name: Relay reliability
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Configure isolated test infrastructure
        run: |
          python3 scripts/configure-demo.py
          docker compose --env-file .env -f deploy/compose.infrastructure.yml -f deploy/compose.observability.yml up -d
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5300/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5300/health
          docker compose --env-file .env -f deploy/compose.infrastructure.yml exec -T postgres psql -U relay -d postgres -c 'CREATE DATABASE relay_test'
          set -a
          source .env
          set +a
          printf 'RELAY_TEST_DATABASE=Host=127.0.0.1;Port=55440;Database=relay_test;Username=relay;Password=%s\n' "$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n' 'RELAY_TEST_SERVICEBUS=Endpoint=sb://127.0.0.1;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;' >> "$GITHUB_ENV"
      - name: Restore locked dependencies
        run: dotnet restore Relay.sln --locked-mode
      - name: Wait for native broker readiness
        run: |
          dotnet build Relay.sln --no-restore
          python3 scripts/wait-broker.py --configuration Debug
      - name: Unit and PostgreSQL invariants
        run: |
          python3 scripts/test-harness.py
          dotnet test tests/Relay.Tests --no-restore --filter 'Category!=Broker' --logger 'trx;LogFileName=core.trx' --results-directory artifacts/test-results
      - name: Actual broker fidelity
        run: dotnet test tests/Relay.Tests --no-build --filter 'Category=Broker' --logger 'trx;LogFileName=broker.trx' --results-directory artifacts/test-results
      - name: Child-process fault injection
        run: |
          dotnet build Relay.sln -c FaultTests --no-restore
          python3 scripts/fault-tests.py
      - name: Release, formatting, alerts, and dependency scan
        run: |
          dotnet build Relay.sln -c Release --no-restore
          python3 scripts/verify-release.py
          dotnet format Relay.sln --verify-no-changes --no-restore
          docker run --rm -v "$PWD/deploy/prometheus/rules.yml:/rules.yml:ro" --entrypoint promtool prom/prometheus:v3.7.3 check rules /rules.yml
          dotnet list Relay.sln package --vulnerable --include-transitive --format json > artifacts/dependency-audit.json
          python3 scripts/check-audit.py artifacts/dependency-audit.json
      - name: Sustained local scenario
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/chaos-test.py
          python3 scripts/load-test.py --events 3000 --workers 2 --rate 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-evidence
          path: |
            artifacts/test-results/
            artifacts/*results.json
            artifacts/dependency-audit.json
      - name: Stop infrastructure
        if: always()
        run: docker compose --env-file .env -f deploy/compose.infrastructure.yml -f deploy/compose.observability.yml down
